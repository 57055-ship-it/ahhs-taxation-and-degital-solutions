    <!-- Initial Theme Detection to prevent FOUC -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ahhs_theme');
          if (saved) {
            document.documentElement.setAttribute('data-theme', saved);
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
